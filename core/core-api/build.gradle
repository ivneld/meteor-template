// 프로젝트에서 유일하게 실행 가능한 모듈. 컨텍스트마다 application / api 패키지가 이 안에 있다.
// domain 은 core-domain, storage 는 storage/db-core 모듈에 있어 계층 경계 중 일부는 Gradle 이, 나머지는 ArchitectureRules(ArchUnit)가 강제한다.
bootJar.enabled = true
jar.enabled = false

dependencies {
    implementation project(':core:core-domain')
    implementation project(':storage:db-core')
    implementation project(':clients:client-example')
    implementation project(':support:logging')
    implementation project(':support:monitoring')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation project(':tests:api-docs')
    testImplementation "com.tngtech.archunit:archunit-junit5:${property('archUnitVersion')}"
}
