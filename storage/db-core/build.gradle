// 저장소 인프라. DataSource, JPA 설정, 모든 엔티티가 상속하는 BaseEntity 만 둔다.
// 엔티티와 Repository 어댑터는 컨텍스트에 속하므로 core-api 의 com.meteor.<context>.storage 에 있다.
// 저장소가 늘어나면(db-log, redis ...) 같은 모양의 모듈을 추가한다.
dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
}
