// 저장소 모듈. 컨텍스트별 JPA 엔티티·Spring Data 인터페이스(<context>.storage)와 저장소 인프라(support.storage).
// 도메인을 모른다. 엔티티는 상태를 문자열로 저장하고, 애그리거트와의 변환은 core-api 의 <context>.repository 어댑터가 한다.
dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
}
