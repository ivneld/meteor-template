name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Common paths are identical
        run: scripts/check-common.sh

  template:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [ separated, unified ]
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: templates/${{ matrix.template }}

      - name: Lint
        run: ./gradlew checkFormat

      - name: Test
        run: ./gradlew test
